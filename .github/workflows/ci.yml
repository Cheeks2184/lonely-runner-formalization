name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build and trust audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
      - name: Audit Lean sources and theorem axioms
        run: python3 scripts/audit_lean_trust.py

  certificates:
    name: Exact computational certificates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install native certificate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev
      - name: Run the complete deterministic regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Replay Response 50 affine transversal certificate
        run: bash scripts/audit_response50.sh
      - name: Replay coefficient-two Gamma selector evidence
        run: bash scripts/audit_coefficient_two_gamma.sh
